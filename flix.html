<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <title>flix</title>
    <meta charset="utf-8">
    
    <!--Sansation body font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Sometype+Mono:ital,wght@0,400..700;1,400..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <style>
    /* NeuroX header 1 font */
    @font-face {
      font-family: NeuroX;
      src: url(fonts/NeuroX.ttf);}
    /* Oddlini header 2 font */
    @font-face {
      font-family: Oddlini;
      src: url(fonts/oddlini-extra-bold.ttf);}
    /* High Empathy disaply font */
    @font-face {
      font-family: HighEmpathy;
      src: url(fonts/HighEmpathy.ttf);}
    
    
    /* typography */
      h1 {
        font-family: NeuroX;
        font-size: 400px;
        color: #320809;
        z-index: -1;
        margin-bottom: -50px;
        margin-top: -50px;}
      
      h2 {
        font-family: HighEmpathy;
        font-size: 225px;
        color: #FF8580;
        paint-order: stroke fill;
        -webkit-text-stroke: 10px #FFFAE7;
        margin-top: -210px;
        margin-bottom: -30px;}
      
      h3 {
        font-family: Oddlini;
        font-size: 32px;
        color: #A9C146;}
      
      h4 {
        font-family: Sansation;
        font-size: 32px;
        margin-top: 100px;
        width: 500px;
        background-color: #FFFAE7;
        text-align: right;
        color: #320809;
      }
      
      p {
        font-family: Sansation;
        font-size: 20px;
        color: #320809;}
      
      a {
        color: #320809;
      }
    
    
    /* navbar */
    .topnav nav{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      margin-bottom: 200px;}
    .topnav ul{
      list-style-type: none;
      display: flex;
      margin: 0;
      padding: 0;}
    .topnav li{
      padding-left: 60px;}
    .topnav a {
      font-family: Oddlini;
      float: left;
      color: #320809;
      text-decoration: none;
      font-size: 20px;}
    .topnav a:hover {
      paint-order: fill stroke;
      -webkit-text-stroke: 1px #320809;
      color: transparent;}
    .topnav a.active {
      color: #FF8580}
    
    
    /* intro */
    .introGrid {
      display: flex;
      gap: 80px;
    }
    .intro {
      height: 425px;
      padding-bottom: 120px;
      display: block;
      text-align: left;
      margin-bottom: 320px;
      }
    
    
    /* main */
    .main {
      gap: 20px;
      margin-bottom: 120px;
    }
    .mainContainer {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: space-between;
    }
    
    
    /* carousel */
    .carousel {
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      width: 1200px;
      margin-bottom: 50px
      }
    .carousel::-webkit-scrollbar {
      display: none;;
      }
    .wrap {
      display: flex;
      gap: 20px;
      animation: scroll 25s infinite linear;
      padding-right: 20px;
      }
    .wrap img{
        border-radius: 10px;
        height: 500px;
      }
    @keyframes scroll {
      from {translate: 0;}
      to {translate: -100%}
      }
    
    
    /* end bg */
      .endBG {
        position: relative;
        z-index: -2;
        left: -300px;
        bottom: -170px;
      }
      .flyingGuy {
        position: relative;
        margin-top: -50px;
        z-index: -1;
      }
    
      
    html {
      width: 1440px; 
      margin: auto;
      background-color: #FFFAE7;
    }
    
    body {
      width: 1200px;
      margin: auto;
    }
  </style>
  </head>

  
  
  
  
  
  <body>
    
    <div class="topnav">
      <nav><a href="index.html"><img src="assets/headerLogo.svg"></a><ul>
        <li><a href="index.html">home</a></li>
        <li><a href="toybox.html">toybox</a></li>
        <li><a class="active" href="flix.html">flix</a></li>
        <li><a href="digest.html">digest</a></li>
        </ul></nav>
    </div>
    
    <!-- intro -->
    <div class="introGrid">
      <div class="intro">
      <h1>FLIX & PICS</h1>
      <h2>flix&pics</h2>
      <p>[ guess who got a digital camera last year !! ༻*ੈ✩‧₊˚ ]</p>
    </div>
      <div class="flyingGuy">
        <img src="flix/flyingGuy.svg">
    </div>
    </div>
    
  
    <div class="endBG">
        <img src="index/greenRect.svg">
    </div>
    
  </body>
</html>
