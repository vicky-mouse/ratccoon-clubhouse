<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <title>Ratccoon Clubhouse</title>
    <meta charset="utf-8">
    
    <!--Sansation body font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Sometype+Mono:ital,wght@0,400..700;1,400..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <style>
    /* NeuroX header 1 font */
    @font-face {
      font-family: NeuroX;
      src: url(fonts/NeuroX.ttf);}
    /* Oddlini header 2 font */
    @font-face {
      font-family: Oddlini;
      src: url(fonts/oddlini-extra-bold.ttf);}
    /* High Empathy disaply font */
    @font-face {
      font-family: HighEmpathy;
      src: url(fonts/HighEmpathy.ttf);}
    
    
    /* typography */
      h1 {
        font-family: NeuroX;
        font-size: 400px;
        color: #320809;
        z-index: -1;
        margin-bottom: -50px;
        margin-top: -50px;}
      
      h2 {
        font-family: HighEmpathy;
        font-size: 225px;
        color: #A9C146;
        paint-order: stroke fill;
        -webkit-text-stroke: 10px #FFFAE7;
        margin-top: -210px;
        margin-bottom: -30px;}
      
      h3 {
        font-family: Oddlini;
        font-size: 32px;
        color: #A9C146;}
      
      p {
        font-family: Sansation;
        font-size: 20px;
        color: #320809;
      }
    
    
    /* navbar */
    .topnav nav{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      margin-bottom: 200px;}
    .topnav ul{
      list-style-type: none;
      display: flex;
      margin: 0;
      padding: 0;}
    .topnav li{
      padding-left: 60px;}
    .topnav a {
      font-family: Oddlini;
      float: left;
      color: #320809;
      text-decoration: none;
      font-size: 20px;}
    .topnav a:hover {
      paint-order: stroke fill;
      -webkit-text-stroke: 1px #320809;
      -webkit-background-clip: text;
      color: transparent;}
    .topnav a.active {
      color: #A9C146}
    
    
    /* intro */
      .intro {
        height: 425px;
        padding-bottom: 100px;
        display: block;
        text-align: center;
      }
  
    
    /* overview nav*/
    .overviewContainer {
      display: grid;
      grid-template-columns: auto auto auto auto;
      background-color: dodgerblue;
      padding-top: 100px;
      padding-bottom: 100px;
      align-items: center;
      justify-content: space-between;}
      
    .overviewCard {
      width: 220px;
      }
    .overviewImg {
      border-radius: 10px;
      width: 220px;
      height: 220px;
      }
    
    
      
    html {
      width: 1440px; 
      margin: auto;
      background-color: #FFFAE7;
    }
    
    body {
      width: 1200px;
      margin: auto;
    }
  </style>
  </head>

  
  
  
  
  
  <body>
    
    <div class="topnav">
      <nav><a href="index.html"><img src="assets/headerLogo.svg"></a><ul>
        <li><a class="active" href="index.html">home</a></li>
        <li><a href="toybox.html">toybox</a></li>
        <li><a href="flix.html">flix</a></li>
        <li><a href="nest.html">nest</a></li>
        </ul></nav>
    </div>
    
    <div class="intro">
      <h1>RATCCOON</h1>
      <h2>clubhouse</h2>
      <p>[ - - - why dont you explore the hive of my mind! - - - ]</p>
    </div>
    
    <div class="overviewContainer">
      <div class="overviewCard">
        <div class="overviewImg"><img src="assets/headerLogo.svg"></div>
      </div>
    </div>
    
    
    
  </body>
</html>
